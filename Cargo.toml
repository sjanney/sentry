[workspace]
members = [
    "crates/sentry-cli",
    "crates/sentry-daemon",
    "crates/sentry-ebpf",
    "crates/sentry-policy",
    "crates/sentry-types",
]
exclude = [
    "tests/vm/toolchain-spike/aya-loader",
    "tests/vm/toolchain-spike/libbpf-rs-loader",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.92"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
